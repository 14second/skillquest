<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Streak — Vocabulary Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#1d3a6e,#2a7fbf);color:#123;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px 14px 30px}
h1{color:#fff;text-align:center;margin:8px 0 2px;font-size:34px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sub{color:#cfe8ff;text-align:center;margin:0 0 14px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:19px;color:#1d3a6e}
.band{display:block;width:100%;min-height:58px;font-size:18px;font-weight:700;background:#eaf3ff;color:#1d3a6e;border:2px solid #bcd8ff;border-radius:14px;margin:8px 0;padding:8px}
.band.sel{background:#ffd94d;border-color:#e0a800;color:#3a2a00}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px}
.modeRow{display:flex;gap:9px}
.mode{flex:1;min-height:52px;font-size:16px;font-weight:700;background:#eaf3ff;color:#1d3a6e;border:2px solid #bcd8ff;padding:8px}
.mode.sel{background:#2a7fbf;color:#fff;border-color:#2a7fbf}
.bigbtn{width:100%;min-height:60px;font-size:20px;font-weight:800;background:#ff9f1a;color:#fff;box-shadow:0 4px 0 #c77400;margin-top:12px}
.bigbtn:active{transform:translateY(2px);box-shadow:none}
.green{background:#2e7d32;box-shadow:0 4px 0 #1b4d1e}
.ghost{width:100%;min-height:52px;font-size:16px;font-weight:700;background:#eef1f5;color:#334;margin-top:9px}
#hud{display:flex;gap:8px;margin-bottom:10px}
.hudbox{flex:1;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;text-align:center;padding:7px 2px;font-size:13px}
.hudbox b{display:block;font-size:21px}
#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#muteBtn{background:rgba(255,255,255,.2);color:#fff;font-size:19px;width:48px;height:48px;border-radius:50%}
#quitBtn{background:rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:700;padding:12px 16px;min-height:48px}
.qtype{color:#5a6b80;font-size:14px;font-weight:700;margin:2px 0 4px;text-transform:uppercase;letter-spacing:.6px}
#qtext{font-size:23px;line-height:1.35;color:#14273f;margin:2px 0 6px;font-weight:600}
body.young #qtext{font-size:28px}
body.young .choice{font-size:24px;min-height:72px}
body.young .qtype{font-size:16px}
.speak{background:#eaf3ff;border:2px solid #bcd8ff;font-size:15px;font-weight:700;color:#1d3a6e;padding:10px 14px;min-height:48px}
.choice{display:block;width:100%;min-height:62px;font-size:20px;font-weight:700;background:#f4f9ff;border:2px solid #bcd8ff;color:#14273f;margin:9px 0;padding:10px;text-align:left}
.choice:active{transform:scale(.98)}
.choice.right{background:#c8f2c0;border-color:#43a047}
.choice.wrong{background:#ffd2d2;border-color:#e53935}
#timerWrap{display:none;background:#dbe9f7;border-radius:999px;height:22px;overflow:hidden;margin:10px 0 2px;position:relative}
#timerBar{height:100%;background:#ff9f1a;width:100%}
#timerTxt{position:absolute;right:10px;top:1px;font-size:13px;font-weight:800;color:#5b3a00}
#hintBox{display:none;background:#fff8d6;border:2px dashed #e0a800;border-radius:12px;padding:10px 12px;font-size:16px;margin:10px 0;color:#5b4a00;line-height:1.45}
#feedback{display:none}
#feedback.ok{background:#eefbe9}#feedback.bad{background:#fdeeee}
#fbWord{font-size:26px;font-weight:800;color:#14273f}
.pos{font-style:italic;color:#5a6b80;font-size:16px}
#fbEx{font-size:18px;line-height:1.4;margin:8px 0}
#fbWhy{font-size:16px;line-height:1.4;background:rgba(255,255,255,.65);border-radius:10px;padding:8px 10px}
.study{font-size:16px;line-height:1.45}
.study li{margin:7px 0}
.small{font-size:14px;color:#5a6b80}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"><button id="muteBtn" aria-label="Mute or unmute">🔊</button><button id="quitBtn" class="hidden">✕ Quit run</button></div>
  <h1>📚 Word Streak</h1>
  <p class="sub">How many words can you get right in a row?</p>

  <div id="titleScr">
    <div class="card"><h2>1. Pick your grade level</h2><div id="bandList"></div></div>
    <div class="card"><h2>2. Pick a mode</h2>
      <div class="modeRow">
        <button class="mode sel" id="modeLearn">🌱 Learning<br><span style="font-weight:400;font-size:13px">No clock — take your time</span></button>
        <button class="mode" id="modeTimed">⏱️ Timed<br><span style="font-weight:400;font-size:13px">20 seconds per question</span></button>
      </div>
      <button class="bigbtn" id="startBtn">▶ Start Streak</button>
      <p class="small" id="bestLine"></p>
    </div>
  </div>

  <div id="gameScr" class="hidden">
    <div id="hud">
      <div class="hudbox">🔥 Streak<b id="hStreak">0</b></div>
      <div class="hudbox">⭐ Score<b id="hScore">0</b></div>
      <div class="hudbox">🏆 Best<b id="hBest">0</b></div>
      <div class="hudbox">✔ Answered<b id="hAns">0</b></div>
    </div>
    <div class="card">
      <button class="speak hidden" id="speakDef" style="float:right">🔊 Hear the clue</button>
      <div class="qtype" id="qType">What word means this?</div>
      <div id="qtext"></div>
      <div id="timerWrap"><div id="timerBar"></div><span id="timerTxt">20</span></div>
      <div id="choices"></div>
      <div id="hintBox"></div>
      <button class="ghost" id="hintBtn">💡 Hint (this question earns half points)</button>
    </div>
    <div class="card" id="feedback">
      <div><span id="fbWord"></span> <span class="pos" id="fbPos"></span>
      <button class="speak" id="speakWord" style="float:right">🔊 Say it</button></div>
      <div id="fbVerdict" style="font-weight:800;font-size:18px;margin-top:6px"></div>
      <div id="fbEx"></div>
      <div id="fbWhy"></div>
      <button class="bigbtn" id="nextBtn">Next ▶</button>
    </div>
  </div>

  <div id="endScr" class="hidden">
    <div class="card">
      <h2 id="endTitle">Run over!</h2>
      <p class="study" id="endStats"></p>
      <h3>✅ Words you knew</h3><ul class="study" id="listRight"></ul>
      <h3>📖 Words to practice</h3><ul class="study" id="listMiss"></ul>
      <button class="bigbtn" id="againBtn">▶ Play again — same level</button>
      <button class="bigbtn green hidden" id="practiceBtn">🎯 Practice missed words</button>
      <button class="ghost" id="changeBtn">Change grade level</button>
    </div>
  </div>
</div>

["nuance","noun",3,"A very small difference in meaning, feeling, or tone.","A good translator notices every nuance in the text."],
["nostalgia","noun",3,"A warm, slightly sad longing for the past.","Old songs filled him with nostalgia for his childhood."],
["discrepancy","noun",3,"A difference between two things that should match.","There was a discrepancy between the two accounts of the event."],
["paradigm","noun",3,"A typical example or model that shapes how people think.","The discovery created a new paradigm in physics."],
["stigma","noun",3,"A mark of shame or disapproval attached to a person or condition.","The campaign works to remove the stigma around asking for help."],
["vernacular","noun",3,"The everyday language spoken by ordinary people in a place.","The novel is written in the local vernacular."],
["catalyst","noun",3,"Something that causes an important change or event to happen faster.","The speech became a catalyst for reform in the city.","In chemistry, it speeds a reaction without being used up"]
]
};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- audio (synthesized, iOS-safe) ---------- */
let AC=null, muted=safeGet("ws_mute") === "1";
function safeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function iosAudio(){try{if("audioSession" in navigator)navigator.audioSession.type="playback";}catch(e){}}
document.addEventListener("pointerdown",()=>{iosAudio();initAudio();},{capture:true});
document.addEventListener("touchstart",()=>{iosAudio();initAudio();},{capture:true,passive:true});
function initAudio(){
  iosAudio();
  if(muted)return;
  try{
    if(!AC){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();}
    if(AC.state==="suspended")AC.resume();
  }catch(e){}
}
function tone(f,t0,d,type,vol){
  if(!AC||muted)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=type||"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
const sfx={
  click(){tone(440,0,0.07,"triangle",0.08);},
  good(){tone(523,0,0.12);tone(659,0.08,0.12);tone(784,0.16,0.2);},
  bad(){tone(196,0,0.18,"square",0.07);tone(147,0.1,0.28,"square",0.07);},
  over(){tone(392,0,0.15);tone(523,0.14,0.15);tone(659,0.28,0.15);tone(784,0.42,0.35);}
};
function updMuteBtn(){$("muteBtn").textContent=muted?"🔇":"🔊";}
$("muteBtn").addEventListener("click",()=>{muted=!muted;safeSet("ws_mute",muted?"1":"0");updMuteBtn();if(!muted){initAudio();sfx.click();}});
updMuteBtn();

/* ---------- speech ---------- */
const canSpeak=("speechSynthesis" in window);
function speak(text){
  if(!canSpeak)return;
  try{const u=new SpeechSynthesisUtterance(text);u.rate=0.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* ---------- game state ---------- */
let band="b35", mode="learn";
let streak=0, score=0, answered=0, correctCt=0, best=0;
let used=new Set(), cur=null, choices=[], isContext=false, nextContext=false;
let hintUsed=false, runOver=false, lastMiss=false, practice=false;
let rightList=[], missList=[], missQueue=[], timerInt=null, timeLeft=20;

function bestKey(b){return "ws_best_"+b;}
function getBest(b){return parseInt(safeGet(bestKey(b))||"0",10)||0;}
function updBestLine(){
  $("bestLine").textContent="Best streaks — "+"Grades 1–2: "+getBest("b12")+" · Grades 3–5: "+getBest("b35")+" · Grades 6–8: "+getBest("b68")+" · Grades 9–12: "+getBest("b912");
}
const bandList=$("bandList");
Object.keys(BANDNAMES).forEach(k=>{
  const b=document.createElement("button");
  b.className="band"+(k===band?" sel":""); b.textContent=BANDNAMES[k]; b.dataset.band=k;
  b.addEventListener("click",()=>{band=k;document.querySelectorAll(".band").forEach(x=>x.classList.toggle("sel",x.dataset.band===k));initAudio();sfx.click();});
  bandList.appendChild(b);
});
$("modeLearn").addEventListener("click",()=>{mode="learn";$("modeLearn").classList.add("sel");$("modeTimed").classList.remove("sel");sfx.click();});
$("modeTimed").addEventListener("click",()=>{mode="timed";$("modeTimed").classList.add("sel");$("modeLearn").classList.remove("sel");sfx.click();});
updBestLine();

function show(id){["titleScr","gameScr","endScr"].forEach(s=>$(s).classList.toggle("hidden",s!==id));$("quitBtn").classList.toggle("hidden",id!=="gameScr");}
function updHud(){$("hStreak").textContent=streak;$("hScore").textContent=score;$("hBest").textContent=best;$("hAns").textContent=answered;}

function startRun(isPractice, practiceWords){
  practice=!!isPractice;
  streak=0;score=0;answered=0;correctCt=0;rightList=[];runOver=false;
  if(practice){missList=[];missQueue=practiceWords.slice();}
  else{missList=[];missQueue=[];used=new Set();}
  best=getBest(band);
  document.body.classList.toggle("young",band==="b12");
  show("gameScr");updHud();nextQuestion();
}

function pickEntry(){
  if(practice){
    if(!missQueue.length)return null;
    return missQueue.shift();
  }
  /* missed words re-queue into the same run's tail where a run continues (practice & play-again),
     and are always offered again via Practice mode; in a main run a miss ends the run by design. */
  let pool=BANK[band].filter(e=>!used.has(e[0]));
  if(!pool.length){used.clear();pool=BANK[band].slice();}
  let want;
  if(streak<3)want=[1,2]; else if(streak<6)want=[2,3,2]; else want=[3,3,2];
  let tier=want[Math.floor(Math.random()*want.length)];
  let cand=pool.filter(e=>e[2]===tier);
  if(!cand.length)cand=pool;
  const e=cand[Math.floor(Math.random()*cand.length)];
  used.add(e[0]);
  return e;
}

function blankSentence(e){
  const re=new RegExp("\\b"+e[0]+"\\b","i");
  return e[4].replace(re,"_____");
}

function nextQuestion(){
  stopTimer();
  cur=pickEntry();
  if(!cur){endRun(true);return;}
  isContext=nextContext; nextContext=false;
  hintUsed=false; lastMiss=false;
  $("feedback").style.display="none";
  $("hintBox").style.display="none";
  $("hintBtn").disabled=false; $("hintBtn").style.display="block";
  /* distractors: same part of speech, same band */
  const samePos=BANK[band].filter(e=>e[1]===cur[1]&&e[0]!==cur[0]);
  choices=shuffle([cur].concat(shuffle(samePos).slice(0,3)));
  $("qType").textContent=isContext?"Fill in the blank — which word fits?":"What word means this?";
  $("qtext").textContent=isContext?blankSentence(cur):cur[3];
  const sd=$("speakDef");
  if(band==="b12"&&canSpeak){sd.classList.remove("hidden");sd.onclick=()=>speak($("qtext").textContent);}
  else sd.classList.add("hidden");
  const box=$("choices"); box.innerHTML="";
  choices.forEach((e,i)=>{
    const b=document.createElement("button");
    b.className="choice"; b.textContent=(i+1)+".  "+e[0]; b.dataset.word=e[0];
    b.addEventListener("click",()=>answer(e,b));
    box.appendChild(b);
  });
  if(mode==="timed"&&!practice)startTimer(); else $("timerWrap").style.display="none";
  window.scrollTo(0,0);
}

function startTimer(){
  timeLeft=20;
  $("timerWrap").style.display="block";
  const upd=()=>{$("timerTxt").textContent=timeLeft;$("timerBar").style.width=(timeLeft/20*100)+"%";};
  upd();
  stopTimer();
  timerInt=setInterval(()=>{timeLeft--;upd();if(timeLeft<=0){stopTimer();timeoutAnswer();}},1000);
}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}

function revealChoices(pickedWord){
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.dataset.word===cur[0])b.classList.add("right");
    else if(b.dataset.word===pickedWord)b.classList.add("wrong");
  });
}

function showFeedback(ok, timedOut){
  const fb=$("feedback");
  fb.className="card "+(ok?"ok":"bad"); fb.id="feedback"; fb.style.display="block";
  $("fbWord").textContent=cur[0];
  $("fbPos").textContent=cur[1];
  $("fbVerdict").textContent=timedOut?"⏰ Time's up!":(ok?"✅ Correct!":"❌ Not quite — the word was:");
  $("fbEx").innerHTML="📖 Example: <i>“"+esc(cur[4])+"”</i>";
  let why="<b>Why it fits:</b> “"+esc(cur[3])+"” — that is exactly what <b>"+esc(cur[0])+"</b> means.";
  if(cur[5])why+="<br>🔎 Word part: "+esc(cur[5]);
  $("fbWhy").innerHTML=why;
  $("speakWord").style.display=canSpeak?"":"none";
  $("nextBtn").textContent=(!ok&&!practice)?"See my results ▶":"Next ▶";
  try{if(fb.scrollIntoView)fb.scrollIntoView({behavior:"smooth",block:"nearest"});}catch(e){}
}

function answer(e,btn){
  initAudio(); stopTimer();
  const ok=e[0]===cur[0];
  revealChoices(e[0]);
  $("hintBtn").style.display="none";
  answered++;
  if(ok){
    correctCt++; streak++;
    score+=hintUsed?5:10;
    rightList.push(cur);
    if(streak>best){best=streak;safeSet(bestKey(band),String(best));}
    if(correctCt%5===0)nextContext=true;
    sfx.good();
  }else{
    lastMiss=true;
    if(!missList.some(m=>m[0]===cur[0]))missList.push(cur);
    sfx.bad();
  }
  updHud(); showFeedback(ok,false);
}

function timeoutAnswer(){
  initAudio();
  revealChoices(null);
  $("hintBtn").style.display="none";
  answered++; lastMiss=true;
  if(!missList.some(m=>m[0]===cur[0]))missList.push(cur);
  updHud(); showFeedback(false,true); sfx.bad();
}

$("nextBtn").addEventListener("click",()=>{
  sfx.click();
  if(lastMiss&&!practice){endRun(false);return;}
  if(practice&&lastMiss){missQueue.push(cur);} /* missed practice words cycle back until mastered or exit */
  nextQuestion();
});

$("hintBtn").addEventListener("click",()=>{
  if(!cur||hintUsed)return;
  hintUsed=true; initAudio(); sfx.click();
  const e=cur;
  let h="💡 Starts with: <b>"+esc(e[0].charAt(0).toUpperCase())+"</b> &nbsp;•&nbsp; Sounds like: <b>"+esc(e[0].replace(/[aeiou]/gi,"_"))+"</b><br>📖 In a sentence: <i>“"+esc(blankSentence(e))+"”</i>";
  if(e[5])h+="<br>🔎 Word part: "+esc(e[5]);
  const box=$("hintBox"); box.innerHTML=h; box.style.display="block";
  $("hintBtn").disabled=true;
});

$("speakWord").addEventListener("click",()=>{if(cur)speak(cur[0]+". "+cur[4]);});

function endRun(finishedBank){
  stopTimer(); runOver=true; sfx.over();
  const acc=answered?Math.round(correctCt/answered*100):0;
  $("endTitle").textContent=practice?"🎯 Practice session done":"🏁 Run over! — "+BANDNAMES[band];
  $("endStats").innerHTML="🔥 Streak reached: <b>"+streak+"</b> · ⭐ Score: <b>"+score+"</b> · ✔ Accuracy: <b>"+acc+"%</b> ("+correctCt+" of "+answered+") · 🏆 Best ever ("+BANDNAMES[band]+"): <b>"+getBest(band)+"</b>"+(finishedBank?"<br>All caught up — nothing left in this pile!":"");
  const mk=(list,el)=>{
    const u=$(el); u.innerHTML="";
    if(!list.length){u.innerHTML="<li class='small'>None</li>";return;}
    list.forEach(e=>{
      const li=document.createElement("li");
      li.innerHTML="<b>"+esc(e[0])+"</b> <span class='pos'>("+esc(e[1])+")</span> — "+esc(e[3]);
      u.appendChild(li);
    });
  };
  mk(rightList,"listRight"); mk(missList,"listMiss");
  $("practiceBtn").classList.toggle("hidden",missList.length===0);
  show("endScr"); updBestLine();
  window.scrollTo(0,0);
}

$("startBtn").addEventListener("click",()=>{initAudio();sfx.click();startRun(false);});
$("againBtn").addEventListener("click",()=>{sfx.click();startRun(false);});
$("practiceBtn").addEventListener("click",()=>{sfx.click();startRun(true,missList.slice());});
$("changeBtn").addEventListener("click",()=>{sfx.click();show("titleScr");});
$("quitBtn").addEventListener("click",()=>{stopTimer();if($("gameScr").classList.contains("hidden"))return;endRun(false);});

document.addEventListener("keydown",ev=>{
  if($("gameScr").classList.contains("hidden"))return;
  if($("feedback").style.display==="block"){if(ev.key==="Enter")$("nextBtn").click();return;}
  const n=parseInt(ev.key,10);
  if(n>=1&&n<=4){const bs=document.querySelectorAll(".choice");if(bs[n-1])bs[n-1].click();}
  if(ev.key==="h"||ev.key==="H")$("hintBtn").click();
});
</script>
</body>
</html>
